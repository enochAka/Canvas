            <div id="pen-settings">
                <div class="settings-item-container">
                    <div>Color Picker</div>
                    <div id="color-picker"></div>
                </div>
                <div class="settings-item-container">
                    <div>Pen Thickness</div>
                    <div id="pen-thickness-container">
                        <input type="range" name="thickness" id="pen-thickness-slider" min="1" max="50" value="1">
                        <div id="pen-thickness-display"></div>
                        <div id="pen-thickness-display-text">1px</div>
                    </div>
                </div>
            </div>

            <div id="eraser-settings">
                <div class="eraser-setting-container" id="pixel-eraser">
                    <div>Pixel Eraser</div>
                    <input type="range" id="pixel-eraser-thickness-slider" name="thickness" min="1" max="50" value="1">
                    <div id="pixel-eraser-thickness"></div>
                    <div id="pixel-eraser-thickness-display-text">1px</div>
                </div>
                <div class="eraser-setting-container">
                    <div>Object Eraser</div>
