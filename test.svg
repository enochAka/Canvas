<svg width="300" height="300" viewBox="0 0 300 300"
     xmlns="http://www.w3.org/2000/svg">

  <!-- Core -->
  <circle cx="150" cy="150" r="20" fill="#2b2b2b"/>

  <!-- Expanded top quarter -->
  <path d="
    M150,150 L150,10 A140,140 0 0 1 290,150 Z"
    fill="#4f8cff"/>

  <!-- Settings text -->
  <text x="220" y="80" fill="#fff" font-size="12">Thickness</text>
  <rect x="180" y="90" width="80" height="6" rx="3" fill="#fff"/>

  <text x="220" y="110" fill="#fff" font-size="12">Opacity</text>
  <rect x="180" y="120" width="80" height="6" rx="3" fill="#fff"/>

  <text x="220" y="140" fill="#fff" font-size="12">Smoothing</text>
  <rect x="180" y="150" width="80" height="6" rx="3" fill="#fff"/>

</svg>
